<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Parking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* CSS */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
    }

    .dashboard-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .dashboard-card:hover {
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.07);
    }

    .parking-slot {
      cursor: pointer;
      transition: opacity 0.18s ease, filter 0.18s ease;
    }

    .parking-slot:hover {
      opacity: 0.85;
      filter: brightness(1.06);
    }

    .parking-slot rect {
      transition: fill 0.25s ease;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- HTML: Structure of the Application -->

  <header class="bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">
          P
        </div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Smart Parking</h1>
      </div>

      <div class="flex items-center gap-2.5">
        <button
          id="toggleSimBtn"
          type="button"
          class="px-4 py-2 rounded-lg text-sm font-medium bg-amber-500 hover:bg-amber-600 text-white transition shadow-sm cursor-pointer"
        >
          Pausar Simulación
        </button>
        <button
          id="randomizeBtn"
          type="button"
          class="px-4 py-2 rounded-lg text-sm font-medium bg-slate-200 hover:bg-slate-300 text-slate-800 transition cursor-pointer"
        >
          Aleatorio
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 flex flex-col gap-6">

    <section aria-label="Dashboard de ocupación" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="dashboard-card p-5">
        <p class="text-sm font-medium text-slate-500">Total de Espacios</p>
        <p id="totalSpacesEl" class="text-3xl font-bold text-slate-900 mt-1">134</p>
        <p class="text-xs text-slate-400 mt-1">Sensores instalados</p>
      </div>

      <div class="dashboard-card p-5">
        <p class="text-sm font-medium text-slate-500">Espacios Disponibles</p>
        <p id="availableSpacesEl" class="text-3xl font-bold text-emerald-600 mt-1">0</p>
        <p class="text-xs text-emerald-600 mt-1">Lugares libres</p>
      </div>

      <div class="dashboard-card p-5">
        <p class="text-sm font-medium text-slate-500">Espacios Ocupados</p>
        <p id="occupiedSpacesEl" class="text-3xl font-bold text-rose-600 mt-1">0</p>
        <p class="text-xs text-rose-600 mt-1">Vehículos detectados</p>
      </div>

      <div class="dashboard-card p-5 flex flex-col justify-between">
        <div class="flex items-center justify-between">
          <p class="text-sm font-medium text-slate-500">Porcentaje de Ocupación</p>
          <span id="occupancyPctEl" class="text-2xl font-bold text-blue-600">0%</span>
        </div>
        <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden mt-3">
          <div id="occupancyBarEl" class="h-full bg-blue-600 transition-all duration-300 rounded-full" style="width: 0%"></div>
        </div>
        <p id="simStateText" class="text-xs text-slate-500 mt-2">Actualización automática activa</p>
      </div>
    </section>

    <section class="dashboard-card p-5">
      <div class="flex flex-wrap items-center justify-between gap-3 pb-4 mb-4 border-b border-slate-100">
        <div class="flex items-center gap-5 text-sm">
          <span class="flex items-center gap-2 font-medium text-slate-700">
            <span class="w-4 h-4 rounded bg-emerald-500 inline-block"></span>
            Disponible
          </span>
          <span class="flex items-center gap-2 font-medium text-slate-700">
            <span class="w-4 h-4 rounded bg-rose-500 inline-block"></span>
            Ocupado
          </span>
        </div>
        <p class="text-xs text-slate-500">
          Haz clic en cualquier espacio para cambiar su estado manualmente
        </p>
      </div>

      <div class="w-full overflow-x-auto rounded-xl border border-slate-300 bg-slate-200">
        <svg
          id="parkingLotSvg"
          viewBox="0 0 960 620"
          class="w-full min-w-[700px] h-auto block select-none"
          role="img"
          aria-label="Plano recto del estacionamiento"
        >
          <rect width="960" height="620" fill="#dbe7da" />

          <rect x="0" y="0" width="960" height="44" fill="#94a3b8" />
          <rect x="910" y="0" width="50" height="620" fill="#94a3b8" />

          <rect x="30" y="56" width="868" height="536" rx="12" fill="#475569" stroke="#334155" stroke-width="2" />

          <rect x="24" y="50" width="880" height="548" rx="14" fill="none" stroke="#ef4444" stroke-width="2.5" />

          <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="10,10" opacity="0.65">
            <line x1="75" y1="90" x2="860" y2="90" />
            <line x1="75" y1="502" x2="860" y2="502" />
            <line x1="115" y1="115" x2="115" y2="480" />
            <line x1="265" y1="115" x2="265" y2="480" />
            <line x1="415" y1="115" x2="415" y2="480" />
            <line x1="565" y1="115" x2="565" y2="480" />
            <line x1="715" y1="115" x2="715" y2="480" />
            <line x1="865" y1="115" x2="865" y2="480" />
          </g>

          <g fill="#e2e8f0" opacity="0.8">
            <polygon points="115,240 109,226 121,226" />
            <polygon points="265,330 259,344 271,344" />
            <polygon points="415,240 409,226 421,226" />
            <polygon points="565,330 559,344 571,344" />
            <polygon points="715,240 709,226 721,226" />
            <polygon points="865,330 859,344 871,344" />
          </g>

          <g font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">
            <text x="190" y="114">Zona A</text>
            <text x="340" y="114">Zona B</text>
            <text x="490" y="114">Zona C</text>
            <text x="640" y="114">Zona D</text>
            <text x="790" y="114">Zona E</text>
          </g>

          <g id="spacesContainer"></g>

          <g transform="translate(415, 175)">
            <circle cx="0" cy="0" r="14" fill="#2563eb" stroke="#ffffff" stroke-width="2" />
            <text x="0" y="4.5" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">P</text>
          </g>

          <!-- Referencia sutil de Oxxo Tec de Monterrey QRO en la esquina inferior derecha -->
          <g transform="translate(755, 535)">
            <rect x="-12" y="-12" width="136" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
            <circle cx="106" cy="10" r="11" fill="#0284c7" />
            <text x="88" y="8" text-anchor="end" fill="#0f172a" font-size="11" font-weight="700">Oxxo Tec </text>
          </g>
        </svg>
      </div>
    </section>
  </main>

  <script>
    //JavaScript ====================

    const ZONES = [
      { code: 'A', xCenter: 190, rows: 12 },
      { code: 'B', xCenter: 340, rows: 12 },
      { code: 'C', xCenter: 490, rows: 12 },
      { code: 'D', xCenter: 640, rows: 12 },
      { code: 'E', xCenter: 790, rows: 12 }
    ];

    let parkingSpaces = [];
    let isSimulating = true;
    let simulationTimer = null;

    function initParkingSpaces() {
      parkingSpaces = [];

      ZONES.forEach((zone) => {
        const slotWidth = 36;
        const slotHeight = 24;
        const startY = 126;
        const stepY = 30;

        for (let row = 0; row < zone.rows; row++) {
          parkingSpaces.push({
            id: `${zone.code}${String(row + 1).padStart(2, '0')}`,
            occupied: Math.random() < 0.55,
            x: zone.xCenter - slotWidth - 2,
            y: startY + row * stepY,
            w: slotWidth,
            h: slotHeight
          });

          parkingSpaces.push({
            id: `${zone.code}${String(row + 13).padStart(2, '0')}`,
            occupied: Math.random() < 0.55,
            x: zone.xCenter + 2,
            y: startY + row * stepY,
            w: slotWidth,
            h: slotHeight
          });
        }
      });

      for (let i = 0; i < 6; i++) {
        parkingSpaces.push({
          id: `L${String(i + 1).padStart(2, '0')}`,
          occupied: Math.random() < 0.55,
          x: 42,
          y: 150 + i * 54,
          w: 36,
          h: 24
        });
      }

      for (let i = 0; i < 8; i++) {
        parkingSpaces.push({
          id: `P${String(i + 1).padStart(2, '0')}`,
          occupied: Math.random() < 0.55,
          x: 130 + i * 74,
          y: 528,
          w: 44,
          h: 26
        });
      }
    }

    function renderParkingLot() {
      const container = document.getElementById('spacesContainer');
      container.innerHTML = '';

      parkingSpaces.forEach((space) => {
        const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        group.classList.add('parking-slot');
        group.setAttribute('data-id', space.id);

        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', space.x);
        rect.setAttribute('y', space.y);
        rect.setAttribute('width', space.w);
        rect.setAttribute('height', space.h);
        rect.setAttribute('rx', '4');
        rect.setAttribute('fill', space.occupied ? '#ef4444' : '#10b981');
        rect.setAttribute('stroke', '#ffffff');
        rect.setAttribute('stroke-width', '1');

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', space.x + space.w / 2);
        text.setAttribute('y', space.y + space.h / 2 + 3.5);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', '#ffffff');
        text.setAttribute('font-size', '9.5');
        text.setAttribute('font-weight', '600');
        text.setAttribute('pointer-events', 'none');
        text.textContent = space.id;

        group.appendChild(rect);
        group.appendChild(text);

        group.addEventListener('click', () => {
          toggleSpace(space.id);
        });

        container.appendChild(group);
      });
    }

    function toggleSpace(spaceId) {
      const space = parkingSpaces.find((item) => item.id === spaceId);
      if (!space) return;

      space.occupied = !space.occupied;

      const rect = document.querySelector(`#spacesContainer g[data-id="${space.id}"] rect`);
      if (rect) {
        rect.setAttribute('fill', space.occupied ? '#ef4444' : '#10b981');
      }

      updateDashboard();
    }

    function updateDashboard() {
      const total = parkingSpaces.length;
      const occupied = parkingSpaces.filter((s) => s.occupied).length;
      const available = total - occupied;
      const occupancyPercentage = Math.round((occupied / total) * 100);

      document.getElementById('totalSpacesEl').textContent = total;
      document.getElementById('availableSpacesEl').textContent = available;
      document.getElementById('occupiedSpacesEl').textContent = occupied;
      document.getElementById('occupancyPctEl').textContent = `${occupancyPercentage}%`;
      document.getElementById('occupancyBarEl').style.width = `${occupancyPercentage}%`;
    }

    function startAutoSimulation() {
      if (simulationTimer) clearInterval(simulationTimer);
      isSimulating = true;

      simulationTimer = setInterval(() => {
        const changesCount = Math.floor(Math.random() * 2) + 1;
        for (let i = 0; i < changesCount; i++) {
          const randomIndex = Math.floor(Math.random() * parkingSpaces.length);
          toggleSpace(parkingSpaces[randomIndex].id);
        }
      }, 2500);

      updateSimulationControls();
    }

    function stopAutoSimulation() {
      isSimulating = false;
      clearInterval(simulationTimer);
      simulationTimer = null;
      updateSimulationControls();
    }

    function updateSimulationControls() {
      const btn = document.getElementById('toggleSimBtn');
      const stateText = document.getElementById('simStateText');

      if (isSimulating) {
        btn.textContent = 'Pausar Simulación';
        btn.className = 'px-4 py-2 rounded-lg text-sm font-medium bg-amber-500 hover:bg-amber-600 text-white transition shadow-sm cursor-pointer';
        stateText.textContent = 'Actualización automática activa';
      } else {
        btn.textContent = 'Iniciar Simulación';
        btn.className = 'px-4 py-2 rounded-lg text-sm font-medium bg-emerald-600 hover:bg-emerald-700 text-white transition shadow-sm cursor-pointer';
        stateText.textContent = 'Simulación pausada';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initParkingSpaces();
      renderParkingLot();
      updateDashboard();
      startAutoSimulation();

      document.getElementById('toggleSimBtn').addEventListener('click', () => {
        if (isSimulating) {
          stopAutoSimulation();
        } else {
          startAutoSimulation();
        }
      });

      document.getElementById('randomizeBtn').addEventListener('click', () => {
        initParkingSpaces();
        renderParkingLot();
        updateDashboard();
      });
    });
  </script>
</body>
</html>
